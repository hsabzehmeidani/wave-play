<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
    <title>WavePlay — Modern Audio Player</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,400;14..32,500;14..32,600;14..32,700&display=swap');
        
        * {
            font-family: 'Inter', system-ui, -apple-system, sans-serif;
        }
        
        body {
            background: radial-gradient(circle at 10% 20%, #0a0c12, #030507);
        }
        
        ::-webkit-scrollbar {
            width: 5px;
        }
        ::-webkit-scrollbar-track {
            background: #1e1e2a;
            border-radius: 10px;
        }
        ::-webkit-scrollbar-thumb {
            background: #3b3f5c;
            border-radius: 10px;
        }
        
        .progress-bar-bg {
            background: #2d2f3e;
            height: 5px;
            border-radius: 20px;
            cursor: pointer;
            transition: all 0.1s;
        }
        .progress-fill {
            background: #3b82f6;
            width: 0%;
            height: 100%;
            border-radius: 20px;
            position: relative;
            transition: width 0.05s linear;
            box-shadow: 0 0 6px rgba(59,130,246,0.5);
        }
        
        .glass-video {
            background: #05070c;
            box-shadow: 0 25px 40px -12px rgba(0,0,0,0.8);
        }
        
        .track-item {
            transition: all 0.2s ease;
        }
        
        .modal-pop {
            animation: modalFloat 0.22s cubic-bezier(0.2, 0.9, 0.4, 1.1) forwards;
        }
        
        @keyframes modalFloat {
            from {
                opacity: 0;
                transform: scale(0.96) translateY(18px);
            }
            to {
                opacity: 1;
                transform: scale(1) translateY(0);
            }
        }
        
        .btn-icon {
            transition: all 0.2s;
        }
        .btn-icon:hover {
            transform: translateY(-1px);
        }
        .btn-icon:active {
            transform: translateY(1px);
        }
        
        .wave-bg-neutral {
            background: radial-gradient(ellipse at 50% 30%, #0f111a, #020308);
        }
    </style>
</head>
<body class="text-gray-200 antialiased flex flex-col h-screen select-none">
    <div class="max-w-7xl mx-auto w-full flex flex-col h-full px-3 md:px-5">
        
        <header class="flex items-center justify-between py-2.5 border-b border-white/10 shrink-0">
            <div class="flex items-center gap-2 me-2">
                <div class="bg-gradient-to-tr from-blue-500 to-indigo-600 w-2 h-8 rounded-xl flex items-center justify-center shadow-lg shadow-blue-500/20" onclick="confirmClearStorage()">
                    <i class="fa-solid fa-waveform text-white text-base cursor-pointer"></i>
                </div>
                <span class="font-bold text-xl tracking-tight bg-gradient-to-r from-white to-gray-300 bg-clip-text text-transparent">WavePlay</span>
            </div>
            
            <div id="header-now-playing" class="text-right max-w-[240px] md:max-w-sm truncate ms-2">
                <span id="header-playlist-name" class="text-xs font-medium text-blue-300/80"></span>
                <span id="header-track-name" class="text-sm font-medium text-gray-200 ml-1"></span>
            </div>
        </header>
        
        <div class="flex-1 flex items-center justify-center py-4 md:py-6 wave-bg-neutral relative" id="player-container">
            <div class="w-full max-w-3xl aspect-video mx-auto">
                <div class="relative rounded-2xl md:rounded-3xl overflow-hidden shadow-2xl glass-video aspect-video mx-auto bg-black/50 backdrop-blur-sm">
                    <video id="main-player" class="w-full h-full object-contain" preload="metadata"></video>
                    
                    <div id="overlay-info" class="absolute bottom-6 left-6 right-6 text-white hidden flex-col gap-1 drop-shadow-lg">
                        <div id="overlay-title" class="text-xl md:text-3xl font-bold"></div>
                        <div id="overlay-artist" class="text-gray-300 text-sm md:text-base"></div>
                    </div>
                    
                    <div id="loading-indicator" class="absolute inset-0 flex items-center justify-center bg-black/60 hidden">
                        <div class="flex flex-col items-center">
                            <div class="w-8 h-8 border-3 border-blue-500 border-t-transparent rounded-full animate-spin"></div>
                            <p class="text-xs mt-3 text-gray-300">loading stream ...</p>
                        </div>
                    </div>
                </div>
                
                <div id="no-media-placeholder" class="absolute inset-0 flex flex-col items-center justify-center text-center hidden pointer-events-none">
                    <i class="fa-solid fa-head-side-headphones text-7xl text-gray-700 mb-5"></i>
                    <p class="text-xl font-medium text-gray-500">WavePlay</p>
                    <p class="text-gray-600 text-sm">pick a track or playlist</p>
                </div>
            </div>
        </div>
        
        <div class="shrink-0 bg-black/40 backdrop-blur-sm border-t border-white/10 px-2 md:px-5 py-3 mt-1 rounded-t-2xl">
            
            <div class="flex flex-row md:items-center gap-2 md:gap-4 mb-4 max-w-5xl mx-auto">
                <div class="flex items-center gap-3 flex-1">
                    <span id="current-time" class="text-xs text-gray-400 w-10">0:00</span>
                    <div onclick="seek(event)" id="progress-container" class="progress-bar-bg flex-1 relative">
                        <div id="progress-bar" class="progress-fill"></div>
                    </div>
                    <span id="duration" class="text-xs text-gray-400 w-10 text-right">0:00</span>
                </div>
                
                <div class="flex items-center gap-3 justify-end md:justify-normal">
                    <i id="volume-icon" onclick="toggleMute()" class="fa-solid fa-volume-high text-gray-400 hover:text-white cursor-pointer text-sm"></i>
                    <input type="range" id="volume-slider" min="0" max="1" step="0.01" value="1" oninput="setVolume(this.value)" class="w-16 md:w-32 accent-blue-500 h-1.5 rounded-full">
                </div>
            </div>
            
            <div class="flex flex-wrap items-center justify-center md:justify-between gap-y-3 max-w-5xl mx-auto">
                <div class="flex items-center gap-1.5 md:gap-2 px-2">
                    <button onclick="showLibraryModal()" class="btn-icon w-9 h-9 md:w-10 md:h-10 rounded-xl bg-white/5 hover:bg-white/10 text-gray-300 flex items-center justify-center" title="Library">
                        <i class="fa-solid fa-music text-base md:text-lg"></i>
                    </button>
                    <button onclick="showPlaylistsModal()" class="btn-icon w-9 h-9 md:w-10 md:h-10 rounded-xl bg-white/5 hover:bg-white/10 text-gray-300 flex items-center justify-center" title="Playlists">
                        <i class="fa-solid fa-list-ul text-base md:text-lg"></i>
                    </button>
                    <button onclick="addCurrentToPlaylist()" class="btn-icon w-9 h-9 md:w-10 md:h-10 rounded-xl bg-white/5 hover:bg-white/10 text-gray-300 flex items-center justify-center" title="Add current to playlist">
                        <i class="fa-solid fa-plus text-base md:text-lg"></i>
                    </button>
                    <button onclick="removeCurrentFromPlaylist()" class="btn-icon w-9 h-9 md:w-10 md:h-10 rounded-xl bg-white/5 hover:bg-red-500/20 text-gray-300 hover:text-red-400 flex items-center justify-center" title="Remove from playlist">
                        <i class="fa-solid fa-trash-can text-base md:text-lg"></i>
                    </button>
                </div>
                
                <div class="flex items-center gap-1.5 md:gap-2 px-2">
                    <button onclick="skipBackward()" class="btn-icon w-9 h-9 md:w-10 md:h-10 rounded-xl hover:bg-white/10 flex items-center justify-center" title="10 seconds backward">
                        <i class="fa-solid fa-rotate-left text-md"></i><span class="text-[11px] font-bold ml-0.5">10</span>
                    </button>
                    <button onclick="playPrevious()" class="btn-icon w-9 h-9 md:w-11 md:h-11 rounded-2xl hover:bg-white/10 flex items-center justify-center" title="Previous track">
                        <i class="fa-solid fa-backward-step text-xl"></i>
                    </button>
                    <button onclick="togglePlay()" id="play-pause-btn" class="w-12 h-12 md:w-14 md:h-14 bg-blue-600 hover:bg-blue-500 rounded-2xl flex items-center justify-center shadow-lg shadow-blue-500/30 transition-all active:scale-95" title="Play/Pause">
                        <i id="play-icon" class="fa-solid fa-play text-2xl ml-0.5"></i>
                    </button>
                    <button onclick="playNext()" class="btn-icon w-9 h-9 md:w-11 md:h-11 rounded-2xl hover:bg-white/10 flex items-center justify-center" title="Next track">
                        <i class="fa-solid fa-forward-step text-xl"></i>
                    </button>
                    <button onclick="skipForward()" class="btn-icon w-9 h-9 md:w-10 md:h-10 rounded-xl hover:bg-white/10 flex items-center justify-center" title="10 seconds forward">
                        <i class="fa-solid fa-rotate-right text-md"></i><span class="text-[11px] font-bold ml-0.5">10</span>
                    </button>
                </div>
                
                <div class="flex items-center gap-1.5 md:gap-2 px-2">
                    <button onclick="stopPlayback()" class="btn-icon w-9 h-9 md:w-10 md:h-10 rounded-xl hover:bg-white/10 text-gray-300 flex items-center justify-center" title="Stop">
                        <i class="fa-solid fa-stop text-lg"></i>
                    </button>
                    <button onclick="toggleShuffle()" id="shuffle-btn" class="btn-icon w-9 h-9 md:w-10 md:h-10 rounded-xl hover:bg-white/10 flex items-center justify-center" title="Shuffle">
                        <i class="fa-solid fa-shuffle text-lg"></i>
                    </button>
                    <button onclick="toggleRepeat()" id="repeat-btn" class="btn-icon w-9 h-9 md:w-10 md:h-10 rounded-xl hover:bg-white/10 flex items-center justify-center" title="Repeat mode">
                        <i id="repeat-icon" class="fa-solid fa-repeat text-lg"></i>
                    </button>
                </div>
            </div>
        </div>
    </div>
    
    <div id="library-modal" class="fixed inset-0 bg-black/80 hidden items-center justify-center z-50 p-4">
        <div class="modal-pop bg-zinc-900 w-full max-w-lg rounded-2xl overflow-hidden shadow-2xl border border-white/10">
            <div class="px-5 py-4 border-b border-white/10 flex justify-between items-center">
                <h3 class="font-semibold text-lg">Your Library</h3>
                <button onclick="hideLibraryModal()" class="text-gray-400 hover:text-white text-2xl">&times;</button>
            </div>
            <div class="p-4 border-b border-white/10">
                <div class="relative">
                    <i class="fa-solid fa-search absolute left-4 top-3 text-gray-500 text-sm"></i>
                    <input id="library-search" onkeyup="filterLibrary()" type="text" placeholder="Search tracks..." class="w-full bg-zinc-800 border border-zinc-700 rounded-xl py-2.5 pl-10 text-sm outline-none focus:border-blue-500">
                </div>
            </div>
            <div id="library-list" class="max-h-[380px] overflow-y-auto text-sm"></div>
            <div class="p-4 flex gap-3 border-t border-white/10">
                <button onclick="hideLibraryModal()" class="flex-1 py-2.5 border border-zinc-700 rounded-xl hover:bg-zinc-800">Cancel</button>
                <button onclick="showNewTrackModal()" class="flex-1 py-2.5 bg-blue-600 hover:bg-blue-500 rounded-xl font-medium">Add New Track</button>
            </div>
        </div>
    </div>
    
    <div id="playlists-modal" class="fixed inset-0 bg-black/80 hidden items-center justify-center z-50 p-4">
        <div class="modal-pop bg-zinc-900 w-full max-w-lg rounded-2xl overflow-hidden">
            <div class="px-5 py-4 border-b border-white/10 flex justify-between">
                <span class="font-semibold text-lg">Playlists</span>
                <button onclick="hidePlaylistsModal()" class="text-gray-400 hover:text-white text-2xl">&times;</button>
            </div>
            <div class="p-4">
                <button onclick="showCreatePlaylistModal()" class="w-full py-3 bg-zinc-800 hover:bg-zinc-700 border border-dashed border-gray-600 rounded-xl flex items-center justify-center gap-2 text-sm mb-4">
                    <i class="fa-solid fa-plus"></i> New Playlist
                </button>
                <div class="p-4 border-b border-white/10">
                    <div class="relative">
                        <i class="fa-solid fa-search absolute left-4 top-3 text-gray-500 text-sm"></i>
                        <input id="playlist-search" onkeyup="filterPlaylists()" type="text" placeholder="Search playlists..." class="w-full bg-zinc-800 border border-zinc-700 rounded-xl py-2.5 pl-10 text-sm outline-none focus:border-blue-500">
                    </div>
                </div>
                <div id="playlists-list" class="space-y-2 max-h-[400px] overflow-auto"></div>
            </div>
            <div class="p-3 text-center text-xs text-gray-500 border-t border-white/5">click playlist to load</div>
        </div>
    </div>
    
    <div id="add-to-pl-modal" class="fixed inset-0 bg-black/80 hidden items-center justify-center z-50 p-4">

            <div class="px-5 py-4 border-b border-white/10 flex justify-between items-center">
                <span class="font-medium">Add to playlist</span>
                <button onclick="hideAddToPlModal()" class="text-gray-400 text-xl">&times;</button>
            </div>
            <div id="playlist-options" class="p-3 max-h-80 overflow-auto"></div>
            <div class="p-4"><button onclick="hideAddToPlModal()" class="w-full py-2.5 border border-zinc-700 rounded-xl">Cancel</button></div>
        </div>
    </div>
    
    <div id="create-pl-modal" class="fixed inset-0 bg-black/80 hidden items-center justify-center z-50 p-4">
        <div class="modal-pop bg-zinc-900 w-full max-w-md rounded-2xl overflow-hidden">
            <div class="px-5 py-4 border-b border-white/10 flex justify-between">
                <span class="font-semibold">Create playlist</span>
                <button onclick="closeCreatePlaylistModal()" class="text-gray-400 text-xl">&times;</button>
            </div>
            <div class="p-5 space-y-4">
                <input type="text" id="new-pl-name" placeholder="Playlist name" class="w-full bg-zinc-800 border border-zinc-700 rounded-xl px-4 py-3 outline-none focus:border-blue-500">
                <div class="flex gap-3">
                    <button onclick="closeCreatePlaylistModal()" class="flex-1 py-2.5 border border-zinc-700 rounded-xl">Cancel</button>
                    <button onclick="confirmCreatePlaylist()" class="flex-1 bg-blue-600 rounded-xl py-2.5">Create</button>
                </div>
            </div>
        </div>
    </div>
    
    <div id="new-track-modal" class="fixed inset-0 bg-black/80 hidden items-center justify-center z-50 p-4">
        <div class="modal-pop bg-zinc-900 w-full max-w-md rounded-2xl overflow-hidden">
            <div class="px-5 py-4 border-b border-white/10 flex justify-between">
                <span class="font-semibold">Add new track</span>
                <button onclick="closeNewTrackModal()" class="text-gray-400 text-xl">&times;</button>
            </div>
            <div class="p-5 space-y-4">
                <input type="text" id="new-track-title" placeholder="Track title" class="w-full bg-zinc-800 border border-zinc-700 rounded-xl px-4 py-3 outline-none">
                <input type="text" id="new-track-artist" placeholder="Artist (optional)" class="w-full bg-zinc-800 border border-zinc-700 rounded-xl px-4 py-3 outline-none">
                <input type="url" id="new-track-url" placeholder="Media URL (mp3, m4a, etc)" class="w-full bg-zinc-800 border border-zinc-700 rounded-xl px-4 py-3 outline-none">
                <div class="flex gap-3">
                    <button onclick="closeNewTrackModal()" class="flex-1 py-2.5 border border-zinc-700 rounded-xl">Cancel</button>
                    <button onclick="confirmAddNewTrack()" class="flex-1 bg-blue-600 rounded-xl py-2.5">Add Track</button>
                </div>
            </div>
        </div>
    </div>

    <div id="clear-storage-modal" class="fixed inset-0 bg-black/80 hidden items-center justify-center z-50 p-4">
        <div class="modal-pop bg-zinc-900 w-full max-w-sm rounded-2xl overflow-hidden">
            <div class="px-5 py-4 border-b border-white/10">
                <h3 class="font-semibold text-lg">Clear Storage</h3>
            </div>
            <div class="p-5">
                <p class="text-gray-300 text-sm">Do you want to clear browser cookies (localStorage) and reload?</p>
                <div class="flex gap-3 mt-5">
                    <button onclick="hideClearStorageModal()" class="flex-1 py-2.5 border border-zinc-700 rounded-xl">Cancel</button>
                    <button onclick="confirmClearStorageAction()" class="flex-1 bg-red-600 rounded-xl py-2.5 hover:bg-red-500">Clear</button>
                </div>
            </div>
        </div>
    </div>

        }
        
        function playTrack(trackId) {
            let track = tracks.find(t => t.id === trackId);
            if(!track) return;
            document.getElementById('no-media-placeholder').classList.add('hidden');
            player.src = track.url;
            player.volume = isMuted ? 0 : currentVolume;
            player.onloadedmetadata = () => {
                document.getElementById('duration').innerText = track.duration || formatTime(player.duration);
                document.getElementById('overlay-title').innerText = track.title;
                document.getElementById('overlay-artist').innerText = track.artist || '';
                document.getElementById('overlay-info').classList.remove('hidden');
                updateHeaderNowPlaying();
            };
            player.play().then(() => { isPlaying = true; updatePlayIcon(); }).catch(e => toast("Cannot play track", true));
            if(currentPlaylist) {
                let idx = queue.indexOf(trackId);
                if(idx !== -1) currentTrackIndex = idx;
            } else {
                queue = [trackId];
                currentTrackIndex = 0;
                currentPlaylist = null;
            }
            updateHeaderNowPlaying();
        }
        
        function togglePlay() { if(!player.src && tracks.length) playTrack(tracks[0].id); else if(isPlaying) { player.pause(); isPlaying=false; updatePlayIcon(); } else { player.play(); isPlaying=true; updatePlayIcon(); } }
        function updatePlayIcon() { let icon = document.getElementById('play-icon'); if(isPlaying) { icon.classList.remove('fa-play'); icon.classList.add('fa-pause'); } else { icon.classList.remove('fa-pause'); icon.classList.add('fa-play'); } }
        function playNext() { if(!queue.length) return; let idx = (currentTrackIndex + 1) % queue.length; currentTrackIndex = idx; playTrack(queue[idx]); }
        function playPrevious() { if(!queue.length) return; let idx = (currentTrackIndex - 1 + queue.length) % queue.length; currentTrackIndex = idx; playTrack(queue[idx]); }
        function stopPlayback() { player.pause(); player.currentTime = 0; isPlaying = false; updatePlayIcon(); }
        function skipBackward() { player.currentTime = Math.max(0, player.currentTime - 10); }
        function skipForward() { player.currentTime = Math.min(player.duration || 0, player.currentTime + 10); }
        
        function toggleShuffle() { isShuffle = !isShuffle; let btn = document.getElementById('shuffle-btn'); if(isShuffle) { btn.classList.add('text-blue-400'); if(currentPlaylist && queue.length>1) { queue = [...queue].sort(()=>Math.random()-0.5); currentTrackIndex=0; toast("Shuffle on"); } } else { btn.classList.remove('text-blue-400'); toast("Shuffle off"); } }
        function toggleRepeat() { repeatMode = (repeatMode+1)%3; let icon = document.getElementById('repeat-icon'); if(repeatMode===1) { icon.classList.add('text-blue-400'); toast("Repeat: one"); } else if(repeatMode===2) { icon.classList.add('text-blue-400'); toast("Repeat: all"); } else { icon.classList.remove('text-blue-400'); toast("Repeat off"); } }
        function setVolume(v) { currentVolume = parseFloat(v); player.volume = currentVolume; isMuted = currentVolume===0; updateVolumeIcon(); }
        function toggleMute() { isMuted = !isMuted; player.volume = isMuted ? 0 : currentVolume; updateVolumeIcon(); }
        function updateVolumeIcon() { let icon = document.getElementById('volume-icon'); if(player.volume===0) icon.className = "fa-solid fa-volume-xmark text-gray-400 hover:text-white cursor-pointer text-sm"; else if(player.volume<0.5) icon.className = "fa-solid fa-volume-low text-gray-400 hover:text-white cursor-pointer text-sm"; else icon.className = "fa-solid fa-volume-high text-gray-400 hover:text-white cursor-pointer text-sm"; }
        
        function removeCurrentFromPlaylist() {
            if(!currentPlaylist) { toast("No active playlist", true); return; }
            let currentId = queue[currentTrackIndex];
            if(!currentId) return;
            let pl = playlists.find(p=>p.id === currentPlaylist.id);
            if(!pl) return;
            let idx = pl.trackIds.indexOf(currentId);
            if(idx === -1) { toast("Track not in playlist", true); return; }
            pl.trackIds.splice(idx,1);
            saveData();
            let newQueue = [...pl.trackIds];
            if(newQueue.length === 0) {
                currentPlaylist = null;
                queue = [];
                currentTrackIndex = -1;
                stopPlayback();
                document.getElementById('no-media-placeholder').classList.remove('hidden');
                toast("Playlist empty, removed track");
            } else {
                let oldPos = currentTrackIndex;
                queue = newQueue;
                let newIdx = queue.indexOf(currentId);
                if(newIdx !== -1) { currentTrackIndex = newIdx; playTrack(currentId); }
                else { currentTrackIndex = 0; playTrack(queue[0]); }
            }
            updateHeaderNowPlaying();
            toast("Removed from playlist");
        }
        
        function addCurrentToPlaylist() { if(!queue.length || currentTrackIndex<0) { toast("No track playing", true); return; } let trackId = queue[currentTrackIndex]; showAddToPlaylistOptions(trackId); }
        
        function showLibraryModal() { document.getElementById('library-modal').classList.remove('hidden'); renderLibrary(); }
        function hideLibraryModal() { document.getElementById('library-modal').classList.add('hidden'); }
        function showPlaylistsModal() { document.getElementById('playlists-modal').classList.remove('hidden'); document.getElementById('playlist-search').value = ''; renderPlaylists(); }
        function filterPlaylists() { let val = document.getElementById('playlist-search').value.toLowerCase(); let filtered = playlists.filter(p => p.name.toLowerCase().includes(val)); renderPlaylists(filtered); }
        function hidePlaylistsModal() { document.getElementById('playlists-modal').classList.add('hidden'); }
        
        function renderLibrary(filter=null) { let list = document.getElementById('library-list'); let items = filter || tracks; list.innerHTML = items.map(t => `<div class="track-item px-5 py-3 flex justify-between items-center border-b border-white/5 cursor-pointer hover:bg-white/5"><div class="flex gap-3"><div class="w-8 h-8 rounded-xl bg-zinc-800 flex items-center justify-center"><i class="fa-solid fa-music text-blue-400 text-sm"></i></div><div><div class="font-medium">${escapeHtml(t.title)}</div><div class="text-xs text-gray-400">${t.artist||'Artist'}</div></div></div><div class="flex gap-2"><span class="text-xs text-gray-500">${t.duration}</span><button onclick="event.stopPropagation(); playTrack(${t.id})" class="bg-zinc-800 p-1.5 rounded-xl hover:bg-blue-600"><i class="fa-solid fa-play text-xs"></i></button><button onclick="event.stopPropagation(); showAddToPlaylistOptions(${t.id})" class="text-gray-400 hover:text-blue-400"><i class="fa-solid fa-plus"></i></button></div></div>`).join(''); }
        function filterLibrary() { let val = document.getElementById('library-search').value.toLowerCase(); if(!val) renderLibrary(); else renderLibrary(tracks.filter(t=> t.title.toLowerCase().includes(val)|| (t.artist||'').toLowerCase().includes(val))); }
        function renderPlaylists(filteredList = null) { let cont = document.getElementById('playlists-list'); let items = filteredList || playlists; cont.innerHTML = items.map(pl => ` <div class="flex justify-between items-center p-3 rounded-xl hover:bg-white/5 cursor-pointer" onclick="loadPlaylist(${pl.id})"> <div class="flex gap-3"> <i class="fa-solid fa-list text-blue-400"></i> <div> <div class="font-medium">${escapeHtml(pl.name)}</div> <div class="text-xs text-gray-500">${pl.trackIds.length} tracks</div> </div> </div> <button class="bg-blue-600/80 text-xs px-3 py-1.5 rounded-full">Play</button> </div> `).join(''); }
        function loadPlaylist(plId) { let pl = playlists.find(p=>p.id===plId); if(!pl) return; currentPlaylist = {...pl}; queue = [...pl.trackIds]; if(queue.length) { currentTrackIndex = 0; playTrack(queue[0]); } else toast("Empty playlist"); hidePlaylistsModal(); updateHeaderNowPlaying(); }
        
        function showCreatePlaylistModal() { document.getElementById('create-pl-modal').classList.remove('hidden'); document.getElementById('new-pl-name').value = ''; }
        function closeCreatePlaylistModal() { document.getElementById('create-pl-modal').classList.add('hidden'); }
        function confirmCreatePlaylist() { let name = document.getElementById('new-pl-name').value.trim(); if(!name) return; let newPl = { id: Date.now(), name: name, trackIds: [] }; playlists.unshift(newPl); saveData(); closeCreatePlaylistModal(); renderPlaylists(); toast(`Playlist "${name}" created`); }
        function showNewTrackModal() { document.getElementById('new-track-modal').classList.remove('hidden'); document.getElementById('new-track-title').value=''; document.getElementById('new-track-artist').value=''; document.getElementById('new-track-url').value=''; }
        function closeNewTrackModal() { document.getElementById('new-track-modal').classList.add('hidden'); }
        function confirmAddNewTrack() { let title = document.getElementById('new-track-title').value.trim(); let artist = document.getElementById('new-track-artist').value.trim() || "Unknown"; let url = document.getElementById('new-track-url').value.trim(); if(!title || !url) { toast("Title & URL required", true); return; } let newTrack = { id: Date.now(), title, artist, url, duration: "0:00" }; tracks.unshift(newTrack); saveData(); closeNewTrackModal(); renderLibrary(); toast("Track added"); }

        function showClearStorageModal() { document.getElementById('clear-storage-modal').classList.remove('hidden'); }
        function hideClearStorageModal() { document.getElementById('clear-storage-modal').classList.add('hidden'); }
        function confirmClearStorageAction() { localStorage.clear(); hideClearStorageModal(); location.reload(); }
        function confirmClearStorage() { showClearStorageModal(); }

        function showAddToPlaylistOptions(trackId) { let container = document.getElementById('playlist-options'); container.innerHTML = ''; let modal = document.getElementById('add-to-pl-modal'); modal.classList.remove('hidden'); if(playlists.length===0) { container.innerHTML = `<div class="p-5 text-center text-gray-400">No playlists yet</div>`; return; } playlists.forEach(pl => { let exists = pl.trackIds.includes(trackId); let btn = document.createElement('div'); btn.className = `p-3 flex justify-between items-center rounded-xl hover:bg-white/5 cursor-pointer ${exists ? 'opacity-50' : ''}`; btn.innerHTML = `<span><i class="fa-regular fa-rectangle-list mr-2"></i>${escapeHtml(pl.name)}</span> ${exists ? '<span class="text-green-400 text-xs">✓ added</span>' : '<span class="text-blue-400">+ Add</span>'}`; if(!exists) btn.onclick = () => { pl.trackIds.push(trackId); saveData(); hideAddToPlModal(); toast(`Added to ${pl.name}`); }; container.appendChild(btn); }); }
        function hideAddToPlModal() { document.getElementById('add-to-pl-modal').classList.add('hidden'); }
        
        function toast(msg, err=false) { let t = document.getElementById('toast'); t.innerText = msg; t.classList.remove('hidden'); if(err) t.classList.add('bg-red-900'); else t.classList.remove('bg-red-900'); setTimeout(()=>t.classList.add('hidden'), 2200); }
        function escapeHtml(str) { if(!str) return ''; return str.replace(/[&<>]/g, function(m){if(m==='&') return '&amp;'; if(m==='<') return '&lt;'; if(m==='>') return '&gt;'; return m;}); }
        
        function setupEvents() { player.addEventListener('timeupdate', updateProgress); player.addEventListener('ended', () => { if(repeatMode===1) { player.currentTime=0; player.play(); } else if(repeatMode===2 || currentTrackIndex < queue.length-1) playNext(); else { isPlaying=false; updatePlayIcon(); } }); player.addEventListener('waiting', ()=>document.getElementById('loading-indicator').classList.remove('hidden')); player.addEventListener('canplay', ()=>document.getElementById('loading-indicator').classList.add('hidden')); player.addEventListener('error', ()=>{ document.getElementById('loading-indicator').classList.add('hidden'); toast("Playback error", true); }); }
        function init() { loadData(); setupEvents(); document.getElementById('no-media-placeholder').classList.remove('hidden'); updateVolumeIcon(); window.addEventListener('keydown', e=>{ if(e.target.tagName==='INPUT') return; if(e.code==='Space') { e.preventDefault(); togglePlay(); } if(e.code==='ArrowRight') skipForward(); if(e.code==='ArrowLeft') skipBackward(); }); }
        
        window.onload = init;
        window.togglePlay=togglePlay; window.playNext=playNext; window.playPrevious=playPrevious; window.stopPlayback=stopPlayback; window.skipBackward=skipBackward; window.skipForward=skipForward; window.showLibraryModal=showLibraryModal; window.hideLibraryModal=hideLibraryModal; window.showPlaylistsModal=showPlaylistsModal; window.hidePlaylistsModal=hidePlaylistsModal; window.loadPlaylist=loadPlaylist; window.playTrack=playTrack; window.addCurrentToPlaylist=addCurrentToPlaylist; window.removeCurrentFromPlaylist=removeCurrentFromPlaylist; window.toggleShuffle=toggleShuffle; window.toggleRepeat=toggleRepeat; window.setVolume=setVolume; window.toggleMute=toggleMute; window.seek=seek; window.filterLibrary=filterLibrary; window.hideAddToPlModal=hideAddToPlModal; window.showCreatePlaylistModal=showCreatePlaylistModal; window.closeCreatePlaylistModal=closeCreatePlaylistModal; window.confirmCreatePlaylist=confirmCreatePlaylist; window.showNewTrackModal=showNewTrackModal; window.closeNewTrackModal=closeNewTrackModal; window.confirmAddNewTrack=confirmAddNewTrack; window.showAddToPlaylistOptions=showAddToPlaylistOptions;
    </script>

</body>
</html>
